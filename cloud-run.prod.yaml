apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-razoonium
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    spec:
      containers:
        - image: europe-west1-docker.pkg.dev/razoonium/api-razoonium/api-razoonium
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "razoonium"
            - name: APP_NAME
              value: "Razoonium"
            - name: ALLOWED_ORIGIN
              value: "https://razoonium.web.app"
            - name: VAPID_SUBJECT
              value: "https://razoonium.web.app"
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: VAPID_PUBLIC_KEY
                  key: latest
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: VAPID_PRIVATE_KEY
                  key: latest
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: API_SECRET_KEY
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
